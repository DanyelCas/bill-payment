<div class="app-container">
  <header class="app-header" *ngIf="authService.isAuthenticated()">
    <div class="header-content">
      <div class="brand">
        <!-- Replaced title with Greeting as requested -->
        <h1 *ngIf="authService.getCurrentUser() as user">Hola, {{ user.name }}</h1>
        <p class="subtitle">Bienvenido a tu Banca en Línea</p>
      </div>
      <div class="user-info" *ngIf="authService.getCurrentUser() as user">
        <button class="btn-logout" (click)="onLogout()">
          Cerrar sesión
        </button>
      </div>
    </div>
  </header>
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
