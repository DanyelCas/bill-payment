<div class="invoice-list-container">
  <!-- Search Removed: Auto-load for logged in user -->

  <app-invoice-table [invoices]="invoices" [isLoading]="isLoading" [error]="error" [hasSearched]="true"
    (payInvoice)="onPayInvoice($event)" (payInvoices)="onPayInvoices($event)"></app-invoice-table>

  <app-invoice-payment [invoices]="selectedInvoicesForPayment" [isOpen]="isPaymentModalOpen"
    [isProcessing]="isProcessingPayment" [paymentSuccess]="paymentSuccess" [paymentError]="paymentError"
    (close)="onClosePaymentModal()" (confirmPayment)="onConfirmPayment($event)"></app-invoice-payment>
</div>
