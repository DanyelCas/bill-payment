<div class="invoice-search-container">
  <h2>Consultar Facturas Pendientes</h2>
  <form [formGroup]="invoiceForm" (ngSubmit)="onSubmit()" class="invoice-form"
    aria-label="Formulario de consulta de facturas">
    <div class="form-group">
      <label for="customerId">ID de Cliente</label>
      <input type="text" id="customerId" formControlName="customerId" class="form-control" placeholder="Ej: 123456"
        [class.error]="customerIdControl?.invalid && customerIdControl?.touched"
        [attr.aria-invalid]="customerIdControl?.invalid && customerIdControl?.touched"
        [attr.aria-describedby]="customerIdErrors ? 'customerId-error' : 'customerId-hint'" />
      <div class="error-message" id="customerId-error" role="alert" *ngIf="customerIdErrors">
        {{ customerIdErrors }}
      </div>
      <small class="form-hint" id="customerId-hint">Ingrese un ID de cliente válido (solo números)</small>
    </div>
    <button type="submit" class="btn btn-primary" [disabled]="invoiceForm.invalid || isLoading"
      [attr.aria-busy]="isLoading">
      <span *ngIf="!isLoading">Buscar</span>
      <output *ngIf="isLoading" aria-live="polite">Cargando...</output>
    </button>
  </form>
</div>
