<div class="dashboard-container">
    <!-- Compact Header & Welcome -->
    <!-- KPI Widgets Row -->
    <div class="widgets-grid" *ngIf="stats">
        <app-summary-widget title="Total Pendiente" [value]="'Bs. ' + (stats.totalPending | number:'1.2-2')"
            icon="circle-alert" color="orange">
        </app-summary-widget>

        <app-upcoming-dues-widget [invoices]="stats.upcomingDues">
        </app-upcoming-dues-widget>

        <app-average-spend-widget [averageAmount]="stats.averageSpend" [monthlyData]="stats.monthlySpendData">
        </app-average-spend-widget>

        <app-summary-widget
            [title]="stats.savingsDetails ? 'Ahorro (' + getSavingsMonthsShort(stats.savingsDetails) + ')' : 'Ahorro Mensual'"
            [value]="'Bs. ' + (stats.monthlySavings | number:'1.2-2')"
            [subtext]="stats.savingsDetails ? 'Bs. ' + (stats.savingsDetails.currentAmount | number:'1.2-2') + ' vs Bs. ' + (stats.savingsDetails.prevAmount | number:'1.2-2') : null"
            icon="piggy-bank" [color]="stats.monthlySavings >= 0 ? 'green' : 'orange'">
        </app-summary-widget>
    </div>

    <!-- Main Content Grid (Table + Chart Side-by-Side) -->
    <div class="main-content-grid">
        <!-- Invoices Section (Left) -->
        <section class="invoices-section">
            <div class="section-header">
                <h3>
                    <lucide-icon name="receipt" [size]="20" class="section-icon"></lucide-icon>
                    Tus Facturas
                </h3>
            </div>
            <app-invoice-list></app-invoice-list>
        </section>

        <!-- Charts Section (Right) -->
        <section class="charts-section">
            <div class="chart-block">
                <div class="section-header">
                    <h3>
                        <lucide-icon name="chart-column" [size]="20" class="section-icon"></lucide-icon>
                        Distribución de Gastos
                    </h3>
                </div>
                <app-spend-chart></app-spend-chart>
            </div>

            <div class="chart-divider"></div>

            <div class="chart-block">
                <div class="section-header">
                    <h3>
                        <lucide-icon name="chart-pie" [size]="20" class="section-icon"></lucide-icon>
                        Estado de Cuentas
                    </h3>
                </div>
                <app-invoice-status-chart></app-invoice-status-chart>
            </div>
        </section>
    </div>
</div>
